[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "911"
version = "0.1.0"
description = "A mini training infrastructure for LLMs — pre-training, post-training, and mechanistic interpretability in pure PyTorch"
readme = "README.md"
authors = [
    {name = "Aman Rangapur", email = "amanrangapur@gmail.com"}
]
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "numpy<2.0",
    "torch>=2.6.0",
    "cached-path>=1.7.2",
    "requests",
    "safetensors",
    # Qwen3-VL modeling code uses transformers utilities only present on git/main
    # (vision_utils, output_capturing, use_kernel_func_from_hub, initialization,
    # maybe_autocast, etc.). Pin to git until the next release.
    "transformers @ git+https://github.com/huggingface/transformers.git",
    "datasets",
    "wandb",
    "tiktoken",
    "tqdm",
    "omegaconf",
    "pyyaml",
]

[project.optional-dependencies]
serve = [
    "fastapi",
    "uvicorn[standard]",
]
workflow = [
    "black",
    "isort",
    "ruff",
]
vlms = [
    "Pillow",
    "torchvision",
    "peft",
    # video backends (optional, pick one at runtime via FORCE_QWENVL_VIDEO_READER)
    "decord ; platform_system != 'Darwin'",
    "torchcodec ; platform_system != 'Darwin'",
]

[project.scripts]
911-train = "pre_training.train:main"
911-train-rl = "post_training.train:main"
911-train-vlm = "vlms.train.train_qwen:train"

[project.urls]
Homepage = "https://github.com/aman-17/911"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pre_training" = ["config.yaml"]

[tool.black]
line-length = 160
include = '\.pyi?$'
exclude = '''
(
      __pycache__
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.vscode
    | \.venv
    | \bdist\b
    | \bdoc\b
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pyright]
reportPrivateImportUsage = false

[tool.ruff]
line-length = 160
target-version = "py311"
exclude = ["tests/*"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
