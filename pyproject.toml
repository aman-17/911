[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "911"
version = "0.1.0"
description = "A mini training infrastructure for LLMs — pre-training, post-training, and mechanistic interpretability in pure PyTorch"
readme = "README.md"
authors = [
    {name = "Aman Rangapur", email = "amanrangapur@gmail.com"}
]
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "numpy<2.0",
    "torch>=2.6.0",
    "cached-path>=1.7.2",
    "requests",
    "safetensors",
    "transformers",
    "datasets",
    "wandb",
    "tiktoken",
    "tqdm",
    "omegaconf",
    "pyyaml",
]

[project.optional-dependencies]
serve = [
    "fastapi",
    "uvicorn[standard]",
]
workflow = [
    "black",
    "isort",
    "ruff",
]

[project.scripts]
911-train = "pre_training.train:main"

[project.urls]
Homepage = "https://github.com/aman-17/911"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pre_training" = ["config.yaml"]

[tool.black]
line-length = 160
include = '\.pyi?$'
exclude = '''
(
      __pycache__
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.vscode
    | \.venv
    | \bdist\b
    | \bdoc\b
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pyright]
reportPrivateImportUsage = false

[tool.ruff]
line-length = 160
target-version = "py311"
exclude = ["tests/*"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
